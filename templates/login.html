{% extends "base.html" %}
{% block title %}Login | VishHunter{% endblock %}
{% block auth_content %}
<main class="login-shell">
  <section class="login-card">
    <div class="login-badge">VH</div>
    <h1 class="login-title">VishHunter</h1>
    <p class="login-subtitle">AI-Driven Vishing Detection System</p>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="d-grid gap-3">
      <div>
        <label class="form-label">Email</label>
        <input class="form-control form-control-dark" type="email" name="email" placeholder="user@example.com" required />
      </div>
      <div>
        <label class="form-label">Password</label>
        <input class="form-control form-control-dark" type="password" name="password" placeholder="Enter your password" required />
      </div>
      <button class="btn btn-primary btn-vish w-100" type="submit">Sign In</button>
    </form>
  </section>
</main>
{% endblock %}
